name: pinnacle-bot (DISABLED 2026-05-23 — 앱이 베트맨 단독으로 동작, snapshots 미사용)

on:
  # schedule: 비활성화 (2026-05-23부터)
  #   - cron: "*/5 * * * *"
  workflow_dispatch:  # 수동 실행만 가능

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements*.txt') }}-requests-supabase
          restore-keys: pip-

      - run: pip install requests supabase

      - uses: actions/cache@v4
        with:
          path: pinnacle_odds.db
          key: pinnacle-db-${{ github.run_number }}
          restore-keys: pinnacle-db-

      - run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
